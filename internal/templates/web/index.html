<!DOCTYPE html>
<html lang="en">
<head>
    {{template "head" .}}
    <title>Dashboard — nixmich</title>
</head>
<body class="app-shell">

{{template "topbar" .}}

<main class="page-content">

    <!-- Immich Container Management -->
    <div class="card">
        <h2 class="card-title">Immich Container</h2>

        <div class="form-group">
            <span class="form-label">Status</span>
            <a href="http://immich.local" target="_blank" id="status"
               hx-get="/status" hx-trigger="load, every 10s"
               style="font-weight: 500; color: var(--color-primary-500);">Loading&#8230;</a>
        </div>

        <div class="btn-group">
            <button class="btn btn-secondary" onclick="submitPost('stop')">Stop</button>
            <button class="btn btn-primary" onclick="submitPost('start')">Start</button>
            <button class="btn btn-ghost" onclick="submitPost('update')">Update</button>
        </div>

        <script>
        function submitPost(action) {
            document.getElementById('status').textContent = 'Loading\u2026';
            fetch('/' + action, { method: 'POST' }).then(function(response) {
                var label = action.charAt(0).toUpperCase() + action.slice(1);
                if (response.ok) {
                    alert(label + ' request submitted successfully.');
                } else {
                    alert('Failed to ' + action + ' Immich.');
                }
            });
        }
        </script>
    </div>

    <!-- Backup to USB -->
    <div class="card">
        <h2 class="card-title">Backup to USB</h2>

        <form id="backup-form">
            <div class="form-group">
                <label class="form-label" for="select-disk">Destination Disk</label>
                <select name="select-disk" id="select-disk" class="form-select"
                        hx-get="/disks" hx-trigger="load">
                    <option>Loading disks&#8230;</option>
                </select>
                <small>Disk must be connected via USB with an exFAT-formatted partition.</small>
            </div>

            <div class="checkbox-row">
                <input type="checkbox" name="verify-backup" id="verify-backup" value="true">
                <div>
                    <label class="form-label" for="verify-backup">Verify backup integrity with checksums</label>
                    <small>Significantly slower but ensures bit-for-bit accuracy.</small>
                </div>
            </div>

            <div class="btn-group">
                <button id="refresh" type="button" class="btn btn-secondary btn-sm"
                        hx-get="/disks" hx-target="#select-disk" hx-swap="innerHTML">
                    Refresh List
                </button>
                <button id="start-backup" type="submit" class="btn btn-primary btn-sm"
                        hx-post="/backup" hx-target="#backup-result"
                        hx-confirm="Are you sure you want to start the backup? This may take some time.">
                    Start Backup
                </button>
            </div>

            <!-- Backup result message -->
            <div id="backup-result"></div>

            <!-- Backup status — loads once, polling controlled by response -->
            <div id="backup-status"
                 hx-get="/backupstatus" hx-trigger="load" hx-swap="innerHTML">
            </div>
        </form>
    </div>

    <!-- Server Commands -->
    <div class="card">
        <h2 class="card-title">Server Commands</h2>
        <div class="btn-group">
            <button class="btn btn-danger" onclick="powerAction('poweroff')">Poweroff</button>
            <button class="btn btn-warning" onclick="powerAction('reboot')">Restart</button>
        </div>

        <script>
        function powerAction(action) {
            var actionText = action === 'reboot' ? 'reboot' : 'poweroff';
            var confirmMessage = action === 'reboot'
                ? 'This will reboot the server. It will take a minute or two before services become available again.'
                : 'This will poweroff the server. You will have to physically press the power button to turn the server back on.';
            if (confirm(confirmMessage)) {
                fetch('/' + action, { method: 'POST' }).then(function(response) {
                    var label = actionText.charAt(0).toUpperCase() + actionText.slice(1);
                    if (response.ok) {
                        alert(label + ' request submitted successfully.');
                    } else {
                        alert('Failed to ' + actionText + ' the server.');
                    }
                });
            }
        }
        </script>
    </div>

</main>
</body>
</html>
